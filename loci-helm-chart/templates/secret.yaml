apiVersion: v1
kind: Secret
metadata:
  name: loci-credentials
  labels:
    {{- include "loci.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-user: {{ .Values.auth.postgresUser | quote }}
  postgres-password: {{ .Values.auth.postgresPassword | quote }}
  keycloak-admin-user: {{ .Values.auth.keycloakAdminUser | quote }}
  keycloak-admin-password: {{ .Values.auth.keycloakAdminPassword | quote }}
  rabbitmq-user: {{ .Values.auth.rabbitmqUser | quote }}
  rabbitmq-password: {{ .Values.auth.rabbitmqPassword | quote }}
  minio-root-user: {{ .Values.auth.minioRootUser | quote }}
  minio-root-password: {{ .Values.auth.minioRootPassword | quote }}
