apiVersion: v1
kind: Service
metadata:
  name: loci-minio
  labels:
    {{- include "loci.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "loci.selector" "loci-minio" | nindent 4 }}
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loci-minio
  labels:
    {{- include "loci.labels" . | nindent 4 }}
    {{- include "loci.selector" "loci-minio" | nindent 4 }}
spec:
  serviceName: loci-minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "loci.selector" "loci-minio" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loci.selector" "loci-minio" | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: loci-credentials, key: minio-root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: loci-credentials, key: minio-root-password } }
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.minio.storage }}
---
# Create the bucket. Anonymous users may read an object by its path (the frontend loads media
# that way) but not list the bucket.
apiVersion: batch/v1
kind: Job
metadata:
  name: loci-minio-bucket
  labels:
    {{- include "loci.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.minio.image }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              until mc alias set local http://loci-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 3; done
              mc mb --ignore-existing local/{{ .Values.minio.bucket }}
              cat > /tmp/policy.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [{
                  "Effect": "Allow",
                  "Principal": {"AWS": ["*"]},
                  "Action": ["s3:GetObject"],
                  "Resource": ["arn:aws:s3:::{{ .Values.minio.bucket }}/*"]
                }]
              }
              POLICY
              mc anonymous set-json /tmp/policy.json local/{{ .Values.minio.bucket }}
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: loci-credentials, key: minio-root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: loci-credentials, key: minio-root-password } }
