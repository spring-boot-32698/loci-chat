apiVersion: v1
kind: Service
metadata:
  name: loci-web
  labels:
    {{- include "loci.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "loci.selector" "loci-web" | nindent 4 }}
  ports:
    - name: http
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loci-web
  labels:
    {{- include "loci.labels" . | nindent 4 }}
    {{- include "loci.selector" "loci-web" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "loci.selector" "loci-web" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loci.selector" "loci-web" | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          # Written into assets/env.js at container start
          env:
            - name: API_URL
              value: /api/v1
            - name: SOCKET_ENDPOINT
              value: wss://{{ include "loci.host" . }}/api/v1/ws
            - name: KEYCLOAK_ISSUER
              value: {{ include "loci.publicUrl" . | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- if .Values.tls.generate }}
          volumeMounts:
            # Served at http://<host>/ca.crt so devices can trust the local CA
            - name: ca
              mountPath: /usr/share/nginx/html/ca.crt
              subPath: ca.crt
              readOnly: true
          {{- end }}
      {{- if .Values.tls.generate }}
      volumes:
        - name: ca
          secret:
            secretName: loci-ca
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
