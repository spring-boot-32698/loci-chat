apiVersion: v1
kind: Service
metadata:
  name: loci-server
  labels:
    {{- include "loci.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "loci.selector" "loci-server" | nindent 4 }}
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loci-server
  labels:
    {{- include "loci.labels" . | nindent 4 }}
    {{- include "loci.selector" "loci-server" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "loci.selector" "loci-server" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loci.selector" "loci-server" | nindent 8 }}
    spec:
      initContainers:
        {{- include "loci.waitForDb" . | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.backend.springProfile | quote }}
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: loci-credentials, key: postgres-user } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: loci-credentials, key: postgres-password } }
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://loci-db:5432/{{ .Values.auth.postgresDatabase }}
            - name: SPRING_DATASOURCE_USERNAME
              value: $(DB_USER)
            - name: SPRING_DATASOURCE_PASSWORD
              value: $(DB_PASSWORD)
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: SPRING_FLYWAY_URL
              value: jdbc:postgresql://loci-db:5432/{{ .Values.auth.postgresDatabase }}
            - name: SPRING_FLYWAY_USER
              value: $(DB_USER)
            - name: SPRING_FLYWAY_PASSWORD
              value: $(DB_PASSWORD)
            - name: MQ_USER
              valueFrom: { secretKeyRef: { name: loci-credentials, key: rabbitmq-user } }
            - name: MQ_PASSWORD
              valueFrom: { secretKeyRef: { name: loci-credentials, key: rabbitmq-password } }
            - name: SPRING_RABBITMQ_HOST
              value: loci-rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              value: /
            - name: SPRING_RABBITMQ_USERNAME
              value: $(MQ_USER)
            - name: SPRING_RABBITMQ_PASSWORD
              value: $(MQ_PASSWORD)
            - name: SPRING_RABBITMQ_STOMP_HOST
              value: loci-rabbitmq
            - name: SPRING_RABBITMQ_STOMP_PORT
              value: "61613"
            - name: STOMP_RELAY_HOST
              value: loci-rabbitmq
            - name: STOMP_RELAY_PORT
              value: "61613"
            - name: STOMP_RELAY_CLIENT_LOGIN
              value: $(MQ_USER)
            - name: STOMP_RELAY_CLIENT_PASSCODE
              value: $(MQ_PASSWORD)
            - name: STOMP_RELAY_SYSTEM_LOGIN
              value: $(MQ_USER)
            - name: STOMP_RELAY_SYSTEM_PASSCODE
              value: $(MQ_PASSWORD)
            - name: SPRING_DATA_REDIS_HOST
              value: loci-redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            # Browser origin: CORS and the WebSocket handshake only accept this
            - name: APPLICATION_CLIENT_BASE_URL
              value: {{ include "loci.publicUrl" . | quote }}
            - name: APPLICATION_CORS_ALLOWED_ORIGINS
              value: {{ include "loci.publicUrl" . | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            # Must match the token's "iss"; JWKs are fetched inside the cluster
            - name: KEYCLOAK_ISSUER_URI_HOST
              value: {{ include "loci.publicUrl" . | quote }}
            - name: KEYCLOAK_JWK_SET_URI_HOST
              value: http://loci-auth:8080
            - name: KEYCLOAK_MIGRATION_PASSWORD
              value: exampleloci123
            - name: KEYCLOAK_CREDENTIALS_USERNAME
              valueFrom: { secretKeyRef: { name: loci-credentials, key: keycloak-admin-user } }
            - name: KEYCLOAK_CREDENTIALS_PASSWORD
              valueFrom: { secretKeyRef: { name: loci-credentials, key: keycloak-admin-password } }
            - name: UPLOAD_MINIO_URL
              value: http://loci-minio:9000
            - name: UPLOAD_MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: loci-credentials, key: minio-root-user } }
            - name: UPLOAD_MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: loci-credentials, key: minio-root-password } }
            - name: UPLOAD_MINIO_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: UPLOAD_MINIO_URL_PREFIX
              value: {{ include "loci.publicUrl" . | quote }}
            - name: UPLOAD_MINIO_REGION
              value: us-east-1
          # Spring Boot exposes liveness/readiness groups automatically on Kubernetes
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
