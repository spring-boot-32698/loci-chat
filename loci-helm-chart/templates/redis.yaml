# Cache only: no persistence
apiVersion: v1
kind: Service
metadata:
  name: loci-redis
  labels:
    {{- include "loci.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "loci.selector" "loci-redis" | nindent 4 }}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loci-redis
  labels:
    {{- include "loci.labels" . | nindent 4 }}
    {{- include "loci.selector" "loci-redis" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "loci.selector" "loci-redis" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loci.selector" "loci-redis" | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
