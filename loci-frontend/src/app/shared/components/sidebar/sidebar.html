<!--
  App Sidebar for navigation
  Mobile as drawer overlay, Desktop as fixed sidebar
-->
<aside class="h-full bg-white dark:bg-gray-800 border-r border-neutral-200 dark:border-gray-700 flex flex-col">

  <!-- Navigation menu -->
  <nav class="pt-20 flex-1 px-4 overflow-y-auto">
    <ul class="space-y-1">
      @for (item of menuItems(); track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-neutral-100 dark:bg-gray-700 text-neutral-900 dark:text-gray-100"
            [routerLinkActiveOptions]="{ exact: false }"
            class="flex items-center space-x-3 px-3 py-2.5 rounded-lg
                   hover:bg-neutral-50 dark:hover:bg-gray-700 cursor-pointer transition-colors
                   text-neutral-700 dark:text-gray-300 group"
          >
            <i
              class="fa-solid {{ item.icon }} text-neutral-600 dark:text-gray-400 w-5 text-center
                     group-hover:text-neutral-700 dark:group-hover:text-gray-200"
            ></i>
            <span class="flex-1 text-sm font-medium">{{ item.label }}</span>

            @if (item.badge) {
              <span
                [class]="'text-white text-xs rounded-full px-2 py-0.5 font-medium min-w-[20px] text-center ' +
                         (item.badgeColor === 'accent' ? 'bg-neutral-500' : 'bg-neutral-500')">
                {{ item.badge }}
              </span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Logout button -->
  <div class="flex-shrink-0 p-4 border-t border-neutral-200 dark:border-gray-700">
    <button
      (click)="onLogout()"
      class="flex items-center space-x-3 px-3 py-2.5 rounded-lg
             hover:bg-red-50 dark:hover:bg-red-950 w-full transition-colors group"
    >
      <i class="fa-solid fa-sign-out-alt text-neutral-600 dark:text-gray-400 w-5 text-center
                group-hover:text-red-600 dark:group-hover:text-red-400"></i>
      <span class="text-neutral-700 dark:text-gray-300 text-sm font-medium group-hover:text-red-600 dark:group-hover:text-red-400">
        Logout
      </span>
    </button>
  </div>

</aside>
