server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  # Redirect all routes to index.html for client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }
  # Media files: backend returns paths relative to the app origin (e.g. loci-bucket-01/<object>)
  location ^~ /loci-bucket-01/ {
    resolver 127.0.0.11 valid=30s; # Docker DNS; resolve at request time so nginx starts without MinIO
    set $minio http://loci-minio:9000;
    proxy_pass $minio;
  }
  # Runtime config generated at container start: never cache
  location = /assets/env.js {
    add_header Cache-Control "no-store";
  }
  # caching for static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000";
  }
}
