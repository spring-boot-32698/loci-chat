# Shared project name so this file and the root compose.yaml (full stack) use the same volumes
name: loci

services:
  loci-db:
    container_name: loci-db
    image: postgres:18.1
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: locidb
    volumes:
      - loci-db:/var/lib/postgresql/data
      # Seed (schema + Keycloak realm + demo data), applied only when the volume is empty
      - ./backups/backup.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # TCP check: only passes after the init script has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d locidb"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: "no"
    ports:
      - 5432:5432
    networks:
      - loci-net

  loci-pgadmin:
    container_name: loci-pgadmin
    image: dpage/pgadmin4:9.11
    restart: "no"
    ports:
      - "81:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - loci-net


  loci-auth:
    container_name: loci-auth
    image: quay.io/keycloak/keycloak:26.0.0
    ports:
      - 9090:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: loci-db
      KC_DB_URL_DATABASE: locidb
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
    networks:
      - loci-net
    depends_on:
      loci-db:
        condition: service_healthy
    volumes:
      # - ./apps/keycloak/import:/opt/keycloak/data/import
      # - loci-keycloak:/opt/keycloak/data
      - ./keycloak-data:/opt/keycloak/data/
      # User export as the data import
      # - ./keycloak-data/export/:/opt/keycloak/data/import

    command: start-dev --import-realm
    restart: "no"

  loci-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: "loci-mq"
    ports:
      - 5672:5672 # Message broker
      - 15672:15672 # UI manager
      - 61613:61613 # Relay
    volumes:
      - loci-rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    command: >
      sh -c "
        rabbitmq-plugins enable --offline rabbitmq_stomp rabbitmq_web_stomp &&
        rabbitmq-server
      "

    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

    networks:
      - loci-net
    restart: "no"

  loci-prometheus:
    image: prom/prometheus:v2.45.0
    container_name: loci-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=10d" # 10-day retention
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle" # Allows hot-reload via API
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # network_mode: host
    ports:
      - "9092:9090"
    networks:
      - loci-net
    extra_hosts:
      # Access via dns
      - "host.docker.internal:host-gateway"
    restart: "no"

  # Visualization

  loci-grafana:
    image: grafana/grafana:10.0.0
    container_name: loci-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - DS_PROMETHEUS=Prometheus
      # Optional: Disable auth for local dev

      # NOTE: remove for production
      # - GF_AUTH_ANONYMOUS_ENABLED=true
      # - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning/dashboards/:/etc/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards/:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - loci-net
    depends_on:
      - loci-prometheus
    restart: "no"

  loci-minio:
    image: cgr.dev/chainguard/minio:latest # quay.io/minio images no longer public
    container_name: loci-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DEFAULT_BUCKETS=loci-bucket-01
    networks:
      - loci-net
    volumes:
      - loci-minio:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc alias set h http://localhost:9000 minioadmin minioadmin >/dev/null && mc ready h"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: "no"

  loci-redis:
    container_name: loci-redis
    image: redis:7.2-alpine
    restart: "no"
    ports:
      - 6379:6379
    volumes:
      - loci-redis:/data
    networks:
      - loci-net

  loci-minio-mc:
    image: cgr.dev/chainguard/minio:latest # bundles mc + sh
    container_name: loci-minio-client
    depends_on:
      - loci-minio
    environment:
      - BUCKET_NAME=${BUCKET_NAME:-loci-bucket-01}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set local http://loci-minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb local/${BUCKET_NAME:-loci-bucket-01};
      /usr/bin/mc anonymous set public local/${BUCKET_NAME:-loci-bucket-01};
      tail -f /dev/null;
      exit 0;
      "
    networks:
      - loci-net

    restart: "no"
networks:
  loci-net:
    driver: bridge
volumes:
  loci-db:
    driver: local
  loci-minio:
    driver: local
  loci-rabbitmq:
    driver: local
  loci-redis:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
